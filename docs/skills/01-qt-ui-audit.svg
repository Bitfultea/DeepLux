<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>
    .title{font-family:'Noto Sans CJK SC';font-size:44px;font-weight:700;fill:#18243A}.sub{font-family:'Noto Sans CJK SC';font-size:22px;fill:#62718A}.label{font-family:'Noto Sans CJK SC';font-size:20px;font-weight:700;fill:#18243A}.body{font-family:'Noto Sans CJK SC';font-size:18px;fill:#52627B}.small{font-family:'Noto Sans CJK SC';font-size:16px;fill:#52627B}.tag{font-family:'Noto Sans CJK SC';font-size:16px;font-weight:700;fill:#0F6CBD}.white{font-family:'Noto Sans CJK SC';font-size:18px;font-weight:700;fill:#FFF}.mono{font-family:'Noto Sans Mono';font-size:16px;fill:#0F6CBD}
  </style></defs>
  <rect width="1600" height="900" fill="#F5F7FB"/><rect width="1600" height="12" fill="#0F6CBD"/>
  <text x="72" y="76" class="tag">DEEPLUX UI ENGINEERING / 01</text><text x="72" y="136" class="title">Qt 界面审计：从症状到共享主题根因</text><text x="72" y="177" class="sub">不是逐控件调色，而是把 MainWindow、子窗口、布局和事件路径放在同一张审计地图上。</text>
  <g transform="translate(72 232)">
    <rect width="880" height="492" rx="12" fill="#FFF" stroke="#C8D5E6" stroke-width="2"/>
    <rect width="880" height="44" rx="12" fill="#17243A"/><rect y="32" width="880" height="12" fill="#17243A"/><text x="22" y="29" class="white">DeepLux Vision — 实际审计窗口</text>
    <rect x="0" y="44" width="880" height="48" fill="#F4F7FB"/><text x="22" y="75" class="small">新建　打开　保存　｜　运行　单步　循环　停止　｜　快速测量　SAM 标注</text>
    <rect x="16" y="110" width="196" height="294" rx="6" fill="#F8FAFD" stroke="#D8E1ED"/><text x="32" y="142" class="label">工具</text><text x="32" y="174" class="small">搜索插件</text><text x="44" y="212" class="small">⌄ 常用工具</text><text x="44" y="244" class="small">⌄ 图像处理</text><text x="44" y="276" class="small">⌄ 几何测量</text>
    <rect x="228" y="110" width="244" height="294" rx="6" fill="#FFF" stroke="#D8E1ED"/><rect x="228" y="110" width="244" height="34" fill="#EEF5FD"/><text x="244" y="133" class="tag">流程　画布　数据源</text><rect x="250" y="170" width="196" height="44" rx="5" fill="#F7F9FC" stroke="#B8C9DE"/><text x="267" y="199" class="small">加载图像　 2.4 ms</text><rect x="250" y="238" width="196" height="44" rx="5" fill="#EAF3FF" stroke="#0F6CBD"/><text x="267" y="267" class="small">找圆　　 3.6 ms</text><rect x="250" y="306" width="196" height="44" rx="5" fill="#F7F9FC" stroke="#B8C9DE"/><text x="267" y="335" class="small">结果输出　0.9 ms</text>
    <rect x="488" y="110" width="376" height="294" rx="6" fill="#EEF1F4" stroke="#D8E1ED"/><text x="506" y="139" class="label">主视图</text><circle cx="678" cy="262" r="86" fill="#9BA4AC"/><circle cx="678" cy="262" r="54" fill="#313C47"/><circle cx="678" cy="262" r="80" fill="none" stroke="#35BE62" stroke-width="3"/><text x="774" y="345" class="small">叠加结果</text>
    <rect x="16" y="420" width="848" height="56" rx="5" fill="#FFF" stroke="#D8E1ED"/><text x="32" y="445" class="tag">运行日志　终端　Agent 对话　Agent 日志</text><text x="32" y="466" class="small">运行状态、异常上下文、审计记录在同一底部工作区</text>
  </g>
  <g transform="translate(1000 232)">
    <text class="label" x="0" y="0">审计顺序：六个高风险面</text>
    <line x1="17" y1="35" x2="17" y2="434" stroke="#9AC6F4" stroke-width="3"/>
    <circle cx="17" cy="62" r="10" fill="#0F6CBD"/><text x="46" y="58" class="label">1. 版式与可读性</text><text x="46" y="84" class="body">边距、分割线、最小高度、长文本与缩放。</text>
    <circle cx="17" cy="132" r="10" fill="#0F6CBD"/><text x="46" y="128" class="label">2. 主题传播</text><text x="46" y="154" class="body">ThemeManager → MainWindow → 子窗口，不留局部硬编码 QSS。</text>
    <circle cx="17" cy="202" r="10" fill="#0F6CBD"/><text x="46" y="198" class="label">3. 状态与焦点</text><text x="46" y="224" class="body">normal / hover / disabled / thinking / confirming / error。</text>
    <circle cx="17" cy="272" r="10" fill="#0F6CBD"/><text x="46" y="268" class="label">4. 交互完整性</text><text x="46" y="294" class="body">点击、拖拽、滚轮、快捷键、关闭重开与所有权。</text>
    <circle cx="17" cy="342" r="10" fill="#0F6CBD"/><text x="46" y="338" class="label">5. 图标与语义</text><text x="46" y="364" class="body">同域同色、动作唯一、选中和禁用状态可辨。</text>
    <circle cx="17" cy="412" r="10" fill="#0F6CBD"/><text x="46" y="408" class="label">6. 真实验收</text><text x="46" y="434" class="body">GUI 截图前后对比 + Qt Test + 二进制时间戳。</text>
  </g>
  <g transform="translate(72 766)"><rect width="1456" height="86" rx="10" fill="#E8F3FE"/><text x="26" y="34" class="tag">主要落点</text><text x="26" y="64" class="mono">src/ui/ThemeManager.cpp　·　MainWindow::applyTheme()　·　QDialog 局部 setStyleSheet()　·　布局 margins / spacing / sizePolicy</text></g>
</svg>
