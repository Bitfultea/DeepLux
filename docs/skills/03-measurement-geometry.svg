<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.title{font-family:'Noto Sans CJK SC';font-size:44px;font-weight:700;fill:#18243A}.sub{font-family:'Noto Sans CJK SC';font-size:22px;fill:#62718A}.head{font-family:'Noto Sans CJK SC';font-size:21px;font-weight:700;fill:#18243A}.body{font-family:'Noto Sans CJK SC';font-size:18px;fill:#52627B}.small{font-family:'Noto Sans CJK SC';font-size:16px;fill:#52627B}.tag{font-family:'Noto Sans CJK SC';font-size:16px;font-weight:700;fill:#7C3AED}.white{font-family:'Noto Sans CJK SC';font-size:18px;font-weight:700;fill:#FFF}.mono{font-family:'Noto Sans Mono';font-size:16px;fill:#6B45CC}</style></defs>
  <rect width="1600" height="900" fill="#F7F6FC"/><rect width="1600" height="12" fill="#7C3AED"/>
  <text x="72" y="76" class="tag">DEEPLUX MEASUREMENT ENGINEERING / 03</text><text x="72" y="136" class="title">2D/3D 测量：拾取语义、几何定义与画面证据必须一致</text><text x="72" y="177" class="sub">测量不是把坐标塞给插件。用户正在量什么、算法按什么算、主视图画出了什么，三者必须能够相互证明。</text>
  <g transform="translate(72 232)">
    <rect width="700" height="392" rx="12" fill="#FFF" stroke="#D9CEF4" stroke-width="2"/><text x="24" y="40" class="head">2D：有限线段的真实最近距离</text>
    <rect x="24" y="64" width="390" height="274" rx="8" fill="#F7F5FF"/><line x1="70" y1="270" x2="342" y2="170" stroke="#7C3AED" stroke-width="7"/><line x1="122" y1="299" x2="394" y2="199" stroke="#D9367A" stroke-width="7"/>
    <line x1="206" y1="220" x2="258" y2="249" stroke="#13A86B" stroke-width="5" stroke-dasharray="9 6"/><circle cx="206" cy="220" r="8" fill="#13A86B"/><circle cx="258" cy="249" r="8" fill="#13A86B"/>
    <text x="54" y="95" class="tag">L1-1 → L1-2</text><text x="284" y="325" class="tag">L2-1 → L2-2</text><rect x="172" y="227" width="112" height="28" rx="4" fill="#13A86B" opacity=".85"/><text x="179" y="245" class="white">最近点对</text>
    <g transform="translate(444 76)"><text class="tag" x="0" y="0">四次拾取顺序</text><text class="body" x="0" y="36">1 / 2：线段 L1 两端</text><text class="body" x="0" y="66">3 / 4：线段 L2 两端</text><line x1="0" y1="90" x2="226" y2="90" stroke="#D9CEF4" stroke-width="2"/><text class="tag" x="0" y="124">正确计算</text><text class="body" x="0" y="156">closestPointsBetweenSegments()</text><text class="body" x="0" y="186">显示最近点之间的连线</text><line x1="0" y1="210" x2="226" y2="210" stroke="#D9CEF4" stroke-width="2"/><text class="tag" x="0" y="244">旧近似为何错误</text><text class="body" x="0" y="276">中点距离会混入沿线错位，</text><text class="body" x="0" y="304">标签线也无法证明距离定义。</text></g>
  </g>
  <g transform="translate(808 232)">
    <rect width="720" height="392" rx="12" fill="#FFF" stroke="#D9CEF4" stroke-width="2"/><text x="24" y="40" class="head">3D：点云坐标、交错线段与测量输入状态</text>
    <rect x="24" y="64" width="324" height="274" rx="8" fill="#F7F5FF"/><path d="M84 278V132m0 146l-34-24m34 24l34-24M84 278l134 43m-134-43l25-20m109 63l-20-29M84 278l-50-78m50 78l-2-33m-48-45l31 13" stroke="#9A84D8" stroke-width="3" fill="none"/>
    <line x1="84" y1="228" x2="267" y2="162" stroke="#7C3AED" stroke-width="7"/><line x1="197" y1="274" x2="155" y2="105" stroke="#D9367A" stroke-width="7"/><line x1="176" y1="195" x2="195" y2="204" stroke="#13A86B" stroke-width="5" stroke-dasharray="9 6"/><circle cx="176" cy="195" r="8" fill="#13A86B"/><circle cx="195" cy="204" r="8" fill="#13A86B"/>
    <text x="48" y="310" class="small">x / y / z 坐标空间</text><g transform="translate(380 80)"><text class="tag" x="0" y="0">MeasurementInput 的模式</text><text class="body" x="0" y="36">point_pair：两点</text><text class="body" x="0" y="66">point_line：点 + 线段两端</text><text class="body" x="0" y="96">line_pair：两条线段</text><text class="body" x="0" y="126">point_plane：点 + 平面三点</text><line x1="0" y1="151" x2="282" y2="151" stroke="#D9CEF4" stroke-width="2"/><text class="tag" x="0" y="184">受控运行</text><text class="body" x="0" y="216">awaitUserPick → 视图拾取</text><text class="body" x="0" y="246">拾取完成 → 继续 RunEngine</text><text class="body" x="0" y="276">停止 → 清除等待状态</text></g>
  </g>
  <g transform="translate(72 666)"><rect width="1456" height="186" rx="10" fill="#F0EBFF"/><text x="26" y="36" class="tag">同名“距离”必须区分算法契约</text><text x="26" y="72" class="body">快速测量：有限线段的最短欧氏距离，主视图连接真实最近点。　流程 LinesDistance：保持无限直线语义，非平行线返回 0，平行线返回垂距。</text><text x="26" y="114" class="mono">MeasurementData::closestPointsBetweenSegments()　·　MainWindow::onPoint2DPicked()　·　MainWindow::onPoint3DPicked()</text><text x="26" y="152" class="small">验收：数值正确、叠加线与数值同义、2D/3D 不丢坐标、交互暂停不会让流程带着默认坐标继续执行。</text></g>
</svg>
