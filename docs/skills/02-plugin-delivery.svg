<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.title{font-family:'Noto Sans CJK SC';font-size:44px;font-weight:700;fill:#18243A}.sub{font-family:'Noto Sans CJK SC';font-size:22px;fill:#62718A}.head{font-family:'Noto Sans CJK SC';font-size:20px;font-weight:700;fill:#18243A}.body{font-family:'Noto Sans CJK SC';font-size:18px;fill:#52627B}.small{font-family:'Noto Sans CJK SC';font-size:16px;fill:#52627B}.tag{font-family:'Noto Sans CJK SC';font-size:16px;font-weight:700;fill:#078C76}.white{font-family:'Noto Sans CJK SC';font-size:19px;font-weight:700;fill:#FFF}.mono{font-family:'Noto Sans Mono';font-size:16px;fill:#087C68}</style></defs>
  <rect width="1600" height="900" fill="#F5F8F7"/><rect width="1600" height="12" fill="#078C76"/>
  <text x="72" y="76" class="tag">DEEPLUX PLUGIN ENGINEERING / 02</text><text x="72" y="136" class="title">插件交付：从目录到独立实例的完整生命周期</text><text x="72" y="177" class="sub">插件不是一个按钮，而是元数据、动态库、配置、执行与部署共同遵守的运行时契约。</text>
  <g transform="translate(72 232)">
    <rect width="356" height="448" rx="12" fill="#FFF" stroke="#B8DDD5" stroke-width="2"/><text x="24" y="40" class="head">插件目录：声明与实现必须一致</text>
    <rect x="22" y="62" width="312" height="286" rx="8" fill="#F2FAF7"/><text x="40" y="93" class="mono">src/plugins/geometry/</text><text x="58" y="125" class="mono">└─ LinesDistance/</text><text x="82" y="157" class="mono">├─ CMakeLists.txt</text><text x="82" y="189" class="mono">├─ metadata.json</text><text x="82" y="221" class="mono">├─ LinesDistancePlugin.h</text><text x="82" y="253" class="mono">└─ LinesDistancePlugin.cpp</text><text x="40" y="312" class="small">metadata：模块 ID、分类、参数、端口、图标</text>
    <rect x="22" y="370" width="312" height="55" rx="6" fill="#E2F5EF"/><text x="40" y="404" class="tag">输入、输出、文案不能三套命名</text>
  </g>
  <g transform="translate(474 232)">
    <rect width="300" height="448" rx="12" fill="#FFF" stroke="#B8DDD5" stroke-width="2"/><text x="24" y="40" class="head">PluginManager 入口关卡</text>
    <path d="M48 80h204v55H48z" fill="#E6F7F2"/><text x="73" y="114" class="tag">发现动态库</text><path d="M150 135v27" stroke="#55AA99" stroke-width="3"/><path d="M142 154l8 10 8-10" fill="none" stroke="#55AA99" stroke-width="3"/>
    <path d="M48 176h204v55H48z" fill="#E6F7F2"/><text x="73" y="210" class="tag">校验接口版本</text><path d="M150 231v27" stroke="#55AA99" stroke-width="3"/><path d="M142 250l8 10 8-10" fill="none" stroke="#55AA99" stroke-width="3"/>
    <path d="M48 272h204v55H48z" fill="#E6F7F2"/><text x="73" y="306" class="tag">读取 metadata</text><path d="M150 327v27" stroke="#55AA99" stroke-width="3"/><path d="M142 346l8 10 8-10" fill="none" stroke="#55AA99" stroke-width="3"/>
    <path d="M48 368h204v55H48z" fill="#078C76"/><text x="73" y="402" class="white">创建独立实例</text>
  </g>
  <g transform="translate(820 232)">
    <rect width="708" height="448" rx="12" fill="#FFF" stroke="#B8DDD5" stroke-width="2"/><text x="24" y="40" class="head">实例在主程序中的四条一致性链路</text>
    <g transform="translate(24 70)"><rect width="150" height="132" rx="8" fill="#EFFAF6"/><text x="18" y="32" class="tag">工程模型</text><text x="18" y="63" class="small">ModuleInstance</text><text x="18" y="89" class="small">id / params / order</text></g>
    <g transform="translate(198 70)"><rect width="150" height="132" rx="8" fill="#EFFAF6"/><text x="18" y="32" class="tag">运行对象</text><text x="18" y="63" class="small">clone()</text><text x="18" y="89" class="small">参数深复制</text></g>
    <g transform="translate(372 70)"><rect width="150" height="132" rx="8" fill="#EFFAF6"/><text x="18" y="32" class="tag">配置界面</text><text x="18" y="63" class="small">检查器 / 弹窗</text><text x="18" y="89" class="small">同字段、同校验</text></g>
    <g transform="translate(546 70)"><rect width="138" height="132" rx="8" fill="#EFFAF6"/><text x="18" y="32" class="tag">执行结果</text><text x="18" y="63" class="small">ImageData</text><text x="18" y="89" class="small">日志 / 叠加</text></g>
    <path d="M174 136h24m150 0h24m150 0h24" stroke="#078C76" stroke-width="3"/><path d="M190 128l10 8-10 8m150-16l10 8-10 8m150-16l10 8-10 8" fill="none" stroke="#078C76" stroke-width="3"/>
    <rect x="24" y="236" width="660" height="166" rx="8" fill="#F2FAF7"/><text x="42" y="270" class="head">必须被测试的失败面</text><text x="42" y="303" class="body">clone 失败不能回退共享单例；配置提交后 Project 与 IModule 参数同步；execute 失败必须返回 false；</text><text x="42" y="334" class="body">拖拽载荷必须来自被拖动项；模块删除后检查器和 RunEngine 不得持有悬空指针。</text><text x="42" y="376" class="tag">这些是插件能否长期扩展的边界，不是单一插件的偶发问题。</text>
  </g>
  <g transform="translate(72 740)"><rect width="1456" height="112" rx="10" fill="#E4F5F0"/><text x="26" y="35" class="tag">运行时验证</text><text x="26" y="68" class="mono">cmake --build build --target sync-plugins  →  ~/.deeplux/plugins  →  PluginManager 加载  →  test_plugincontracts / 目标模块单测</text><text x="26" y="94" class="small">只有重新构建并同步后的 .so 才是用户实际运行的插件。</text></g>
</svg>
