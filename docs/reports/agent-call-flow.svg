<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .title { font-size: 42px; font-weight: 700; }
      .note { font-size: 22px; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 18; }
      .blue { fill: #eaf3ff; stroke: #80aeea; }
      .green { fill: #eaf8ef; stroke: #82c99a; }
      .yellow { fill: #fff7df; stroke: #e1bd5b; }
      .red { fill: #fff0f0; stroke: #e88b8b; }
      .dark { fill: #111827; stroke: #111827; }
      .darkText { fill: #ffffff; font-size: 22px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .small { font-size: 20px; fill: #374151; }
      .line { stroke: #4b5563; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="82" class="title">DeepLux Agent 调用软件流程</text>
  <text x="80" y="122" class="note">入口统一到 AgentController，经过权限确认后，只能调用 ToolSchema 白名单里的软件能力。</text>

  <rect x="80" y="210" width="230" height="110" class="box blue"/>
  <text x="195" y="256" text-anchor="middle" class="label">用户</text>
  <text x="195" y="288" text-anchor="middle" class="small">Agent 对话 Tab</text>

  <rect x="80" y="410" width="230" height="110" class="box blue"/>
  <text x="195" y="456" text-anchor="middle" class="label">外部 Agent</text>
  <text x="195" y="488" text-anchor="middle" class="small">JSON tool_call</text>

  <rect x="390" y="210" width="250" height="110" class="box"/>
  <text x="515" y="256" text-anchor="middle" class="label">MainWindow</text>
  <text x="515" y="288" text-anchor="middle" class="small">聊天消息进入</text>

  <rect x="390" y="410" width="250" height="110" class="box"/>
  <text x="515" y="456" text-anchor="middle" class="label">AgentBridge</text>
  <text x="515" y="488" text-anchor="middle" class="small">外部工具调用入口</text>

  <rect x="740" y="310" width="280" height="120" class="box dark"/>
  <text x="880" y="358" text-anchor="middle" class="darkText">AgentController</text>
  <text x="880" y="392" text-anchor="middle" class="darkText">上下文 + 状态 + 权限</text>

  <rect x="1120" y="190" width="250" height="110" class="box yellow"/>
  <text x="1245" y="236" text-anchor="middle" class="label">LLM 推理</text>
  <text x="1245" y="268" text-anchor="middle" class="small">选择工具或直接回复</text>

  <rect x="1120" y="380" width="250" height="120" class="box yellow"/>
  <text x="1245" y="426" text-anchor="middle" class="label">权限判断</text>
  <text x="1245" y="458" text-anchor="middle" class="small">Observer / Advisor</text>
  <text x="1245" y="486" text-anchor="middle" class="small">Autopilot / 高风险</text>

  <rect x="1120" y="570" width="250" height="105" class="box red"/>
  <text x="1245" y="614" text-anchor="middle" class="label">工具确认卡片</text>
  <text x="1245" y="646" text-anchor="middle" class="small">用户确认后执行</text>

  <rect x="740" y="590" width="280" height="110" class="box green"/>
  <text x="880" y="636" text-anchor="middle" class="label">AgentActor</text>
  <text x="880" y="668" text-anchor="middle" class="small">执行白名单工具</text>

  <rect x="390" y="610" width="250" height="110" class="box green"/>
  <text x="515" y="656" text-anchor="middle" class="label">DeepLux 能力</text>
  <text x="515" y="688" text-anchor="middle" class="small">项目 / 流程 / 插件</text>

  <rect x="80" y="610" width="230" height="110" class="box green"/>
  <text x="195" y="656" text-anchor="middle" class="label">结果回写</text>
  <text x="195" y="688" text-anchor="middle" class="small">动作日志 / Undo</text>

  <path class="line" d="M 310 265 L 390 265"/>
  <path class="line" d="M 310 465 L 390 465"/>
  <path class="line" d="M 640 265 C 690 265 690 370 740 370"/>
  <path class="line" d="M 640 465 C 690 465 690 370 740 370"/>
  <path class="line" d="M 1020 370 C 1070 370 1070 245 1120 245"/>
  <path class="line" d="M 1245 300 L 1245 380"/>
  <path class="line" d="M 1245 500 L 1245 570"/>
  <path class="line" d="M 1120 622 L 1020 645"/>
  <path class="line" d="M 1120 440 L 1020 645"/>
  <path class="line" d="M 740 645 L 640 665"/>
  <path class="line" d="M 390 665 L 310 665"/>
  <path class="line dash" d="M 195 610 C 195 555 720 555 880 430"/>
  <path class="line dash" d="M 1020 645 C 1165 735 1345 690 1370 500 C 1385 390 1335 330 1245 300"/>

  <text x="1045" y="178" class="small">请求携带工具 schema</text>
  <text x="1280" y="548" class="small">需要确认</text>
  <text x="1000" y="615" class="small">安全工具直达</text>
  <text x="330" y="585" class="small">软件状态改变</text>
  <text x="400" y="545" class="small">工具结果进入下一轮 Agent Loop</text>
</svg>
