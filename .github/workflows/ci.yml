name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ubuntu-qt5:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake qttools5-dev \
            libqt5serialport5-dev libeigen3-dev libopencv-dev \
            libssl-dev pkg-config cmake build-essential

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Sync plugins
        run: cmake --build build --target sync-plugins

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30

  # 阶5: 格式门禁只检查 PR/提交变更的 C++ 文件（受控列表），避免整仓大规模改动。
  # 本轮修改文件已全部格式化，故对变更文件的检查可通过；不静默（set -e）。
  format-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format check (changed files only)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          FILES=$(git diff --name-only "$BASE" HEAD -- 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' \
                    'src/**/*.cpp' 'src/**/*.h' 'tests/**/*.cpp' 'tests/**/*.h')
          if [ -z "$FILES" ]; then echo "No C++ files changed; format gate passes."; exit 0; fi
          echo "Checking changed files:"; echo "$FILES"
          clang-format --dry-run --Werror $FILES

  # 步6: Windows 编译门禁（含 ConPTY/串口依赖）
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 (+SerialPort)
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.5.3
          arch: win64_msvc64
          modules: qtserialport
      - name: Install vcpkg deps
        run: vcpkg install eigen3 opencv4 --triplet x64-windows
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release -j

  ubuntu-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev \
            libqt6serialport6-dev libeigen3-dev libopencv-dev \
            libssl-dev pkg-config cmake build-essential

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
