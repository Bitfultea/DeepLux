name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-affinity-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test ABI export scanner
        run: python3 scripts/test_plugin_abi_exports.py
      - name: Test affinity scanner
        run: python3 scripts/test_plugin_affinity.py
      - name: Check worker plugin execution paths
        run: python3 scripts/check_plugin_affinity.py

  ubuntu-qt5:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake qttools5-dev \
            libqt5serialport5-dev libeigen3-dev libopencv-dev \
            libssl-dev pkg-config cmake build-essential

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DDEEPLUX_NATIVE_SAM=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify plugin ABI exports
        run: python3 scripts/check_plugin_abi_exports.py --build-dir build

      - name: Isolate plugin data directory
        run: |
          APP_DATA_DIR="$RUNNER_TEMP/deeplux-appdata-qt5"
          rm -rf "$APP_DATA_DIR/plugins"
          echo "DEEPLUX_APP_DATA_DIR=$APP_DATA_DIR" >> "$GITHUB_ENV"

      - name: Sync plugins
        run: cmake --build build --target sync-plugins

      - name: Verify isolated plugin sync
        run: cmp build/lib/libFitCirclePlugin.so "$DEEPLUX_APP_DATA_DIR/plugins/FitCircle/libFitCirclePlugin.so"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # 阶5: 格式门禁只检查 PR/提交变更的 C++ 文件（受控列表），避免整仓大规模改动。
  # 本轮修改文件已全部格式化，故对变更文件的检查可通过；不静默（set -e）。
  format-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format check (changed files only)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          FILES=$(git diff --name-only "$BASE" HEAD -- 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' \
                    'src/**/*.cpp' 'src/**/*.h' 'tests/**/*.cpp' 'tests/**/*.h')
          if [ -z "$FILES" ]; then echo "No C++ files changed; format gate passes."; exit 0; fi
          echo "Checking changed files:"; echo "$FILES"
          clang-format --dry-run --Werror $FILES

  # 步6: Windows 编译门禁（含 ConPTY/串口依赖）
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 (+SerialPort)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtserialport
      - name: Install vcpkg deps
        run: vcpkg install eigen3 opencv4 --triplet x64-windows
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBUILD_TESTS=OFF -DDEEPLUX_NATIVE_SAM=OFF
      - name: Build
        run: cmake --build build --config Release -j
      - name: Verify plugin ABI exports
        run: python scripts/check_plugin_abi_exports.py --build-dir build --check-release-no-test-hooks
      - name: Isolate plugin data directory
        shell: pwsh
        run: |
          $appDataDir = Join-Path $env:RUNNER_TEMP "deeplux-appdata-windows"
          Remove-Item (Join-Path $appDataDir "plugins") -Recurse -Force -ErrorAction SilentlyContinue
          Add-Content -Path $env:GITHUB_ENV -Value "DEEPLUX_APP_DATA_DIR=$appDataDir"
      - name: Sync plugins
        run: cmake --build build --config Release --target sync-plugins
      - name: Verify isolated plugin sync
        shell: pwsh
        run: |
          $built = Get-ChildItem "build/bin", "build/lib" -Filter "FitCirclePlugin.dll" -File -Recurse |
            Select-Object -First 1
          $synced = Get-ChildItem (Join-Path $env:DEEPLUX_APP_DATA_DIR "plugins") -Filter "FitCirclePlugin.dll" -File -Recurse |
            Select-Object -First 1
          if (-not $built -or -not $synced) { throw "FitCirclePlugin.dll missing from build or isolated plugin tree" }
          if ((Get-FileHash $built.FullName -Algorithm SHA256).Hash -ne
              (Get-FileHash $synced.FullName -Algorithm SHA256).Hash) {
            throw "isolated FitCirclePlugin.dll differs from the build artifact"
          }
      - name: Deploy runtime and run CLI smoke test
        run: cmake --build build --config Release --target deploy-windows

  ubuntu-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev \
            libqt6serialport6-dev libeigen3-dev libopencv-dev \
            libssl-dev pkg-config cmake build-essential xvfb

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DDEEPLUX_TEST_QPA_PLATFORM=xcb -DDEEPLUX_NATIVE_SAM=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify plugin ABI exports
        run: python3 scripts/check_plugin_abi_exports.py --build-dir build

      - name: Isolate plugin data directory
        run: |
          APP_DATA_DIR="$RUNNER_TEMP/deeplux-appdata-qt6"
          rm -rf "$APP_DATA_DIR/plugins"
          echo "DEEPLUX_APP_DATA_DIR=$APP_DATA_DIR" >> "$GITHUB_ENV"

      - name: Sync plugins
        run: cmake --build build --target sync-plugins

      - name: Verify isolated plugin sync
        run: cmp build/lib/libFitCirclePlugin.so "$DEEPLUX_APP_DATA_DIR/plugins/FitCircle/libFitCirclePlugin.so"

      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure
